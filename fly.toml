# Entorno de PRUEBAS (staging) en Fly.io. El nombre de la app lo pasa el
# despliegue (-a), ver el trabajo deploy-staging en .github/workflows/ci.yml.
# Los secretos (DATABASE_URL) se guardan en Fly, nunca aquí.

primary_region = "mad"

[build]
  dockerfile = "Dockerfile"
  build-target = "runtime"

[env]
  # La IP real del cliente la fija el proxy de Fly en esta cabecera (X-Forwarded-For se puede falsear).
  CLIENT_IP_HEADER = "fly-client-ip"
  # Solo en pruebas, para poder crear la primera cuenta. Desactivar después.
  AUTH_ALLOW_SIGNUP = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # Pruebas: se apaga sin tráfico y arranca con la primera petición (más barato).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
